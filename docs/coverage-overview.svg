<svg xmlns="http://www.w3.org/2000/svg" width="320" height="568" viewBox="0 0 320 568" role="img" aria-labelledby="title description">
  <title id="title">Pothole Reporter coverage overview</title>
  <desc id="description">Complaint handoff coverage across all of Maharashtra, Delhi, Ahmedabad, Bengaluru, Hyderabad, Chennai and Kolkata, plus mapped National Highways across India for potholes.</desc>
  <defs>
    <linearGradient id="state-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#251b15"/>
    </linearGradient>
    <linearGradient id="road-card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17291e"/>
      <stop offset="1" stop-color="#14221a"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill: #ff9b54; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { fill: #f2f2f4; font-size: 24px; font-weight: 750; }
      .section { fill: #9a9ba1; font-size: 9px; font-weight: 700; letter-spacing: 1.25px; }
      .place { fill: #f2f2f4; font-size: 13px; font-weight: 700; }
      .scope { fill: #aeb0b6; font-size: 9px; font-weight: 500; }
    </style>
  </defs>

  <rect width="320" height="568" rx="24" fill="#111214"/>
  <rect x="1" y="1" width="318" height="566" rx="23" fill="none" stroke="#2a2b30" stroke-width="2"/>

  <!-- Subtle road lines keep the card geographic without representing boundaries. -->
  <path d="M-18 142 C55 119 97 151 159 125 S263 75 345 103" fill="none" stroke="#24252a" stroke-width="2"/>
  <path d="M-9 171 C67 154 101 181 174 157 S271 111 337 139" fill="none" stroke="#202126" stroke-width="1"/>

  <g transform="translate(22 23)">
    <path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.2 12 31 12 31s12-10.8 12-19.3C24 5.2 18.6 0 12 0Z" fill="#ff7a1a"/>
    <circle cx="12" cy="11.5" r="4.2" fill="#1a1206"/>
  </g>
  <text x="56" y="32" class="eyebrow">POTHOLE REPORTER</text>
  <text x="56" y="57" class="heading">Where it works</text>

  <rect x="20" y="83" width="280" height="112" rx="16" fill="url(#state-card)" stroke="#ff7a1a"/>
  <rect x="36" y="99" width="76" height="20" rx="10" fill="#ff7a1a"/>
  <text x="74" y="113" text-anchor="middle" fill="#1a1206" font-size="9" font-weight="800" letter-spacing="0.8">STATEWIDE</text>
  <text x="36" y="147" fill="#ffffff" font-size="22" font-weight="750">Maharashtra</text>
  <text x="36" y="167" fill="#ffc79e" font-size="11" font-weight="600">Civic complaint handoff</text>
  <text x="36" y="182" fill="#d8b499" font-size="10">throughout the state</text>
  <circle cx="258" cy="139" r="26" fill="#ff7a1a" fill-opacity="0.12" stroke="#ff9b54" stroke-opacity="0.45"/>
  <text x="258" y="145" text-anchor="middle" fill="#ff9b54" font-size="18" font-weight="800">MH</text>

  <text x="20" y="220" class="section">CITY-SCOPE HANDOFFS</text>

  <g>
    <rect x="20" y="234" width="134" height="45" rx="11" fill="#1c1d21" stroke="#2a2b30"/>
    <circle cx="35" cy="249" r="4" fill="#ff7a1a"/>
    <text x="45" y="253" class="place">Delhi NCT</text>
    <text x="35" y="269" class="scope">Full NCT</text>

    <rect x="166" y="234" width="134" height="45" rx="11" fill="#1c1d21" stroke="#2a2b30"/>
    <circle cx="181" cy="249" r="4" fill="#ff7a1a"/>
    <text x="191" y="253" class="place">Kolkata</text>
    <text x="181" y="269" class="scope">KMC limits</text>

    <rect x="20" y="288" width="134" height="45" rx="11" fill="#1c1d21" stroke="#2a2b30"/>
    <circle cx="35" cy="303" r="4" fill="#ff7a1a"/>
    <text x="45" y="307" class="place">Ahmedabad</text>
    <text x="35" y="323" class="scope">Reviewed footprint</text>

    <rect x="166" y="288" width="134" height="45" rx="11" fill="#1c1d21" stroke="#2a2b30"/>
    <circle cx="181" cy="303" r="4" fill="#ff7a1a"/>
    <text x="191" y="307" class="place">Hyderabad</text>
    <text x="181" y="323" class="scope">CURE area</text>

    <rect x="20" y="342" width="134" height="45" rx="11" fill="#1c1d21" stroke="#2a2b30"/>
    <circle cx="35" cy="357" r="4" fill="#ff7a1a"/>
    <text x="45" y="361" class="place">Chennai</text>
    <text x="35" y="377" class="scope">GCC limits</text>

    <rect x="166" y="342" width="134" height="45" rx="11" fill="#1c1d21" stroke="#2a2b30"/>
    <circle cx="181" cy="357" r="4" fill="#ff7a1a"/>
    <text x="191" y="361" class="place">Bengaluru</text>
    <text x="181" y="377" class="scope">Five city corporations</text>
  </g>

  <rect x="20" y="399" width="280" height="35" rx="10" fill="#1c1d21" stroke="#2a2b30"/>
  <path d="M34 417h11m-5.5-5.5v11" stroke="#ff9b54" stroke-width="2" stroke-linecap="round"/>
  <text x="55" y="414" fill="#f2f2f4" font-size="11" font-weight="700">Karnataka urban bodies</text>
  <text x="55" y="426" fill="#aeb0b6" font-size="9">Road-damage routing</text>

  <rect x="20" y="446" width="280" height="67" rx="14" fill="url(#road-card)" stroke="#315e3e"/>
  <g transform="translate(35 461)">
    <path d="M0 26 7 0h14l7 26Z" fill="#25392b" stroke="#3ecf6f"/>
    <path d="M14 3v6m0 5v7" stroke="#b4f3c8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="76" y="469" fill="#7ce89f" font-size="9" font-weight="800" letter-spacing="0.9">ACROSS INDIA</text>
  <text x="76" y="488" fill="#f2f2f4" font-size="14" font-weight="750">Mapped National Highways</text>
  <text x="76" y="503" fill="#a9c7b2" font-size="9.5">Pothole reports on NH / NE carriageways</text>

  <line x1="20" y1="529" x2="300" y2="529" stroke="#2a2b30"/>
  <text x="160" y="545" text-anchor="middle" fill="#85868c" font-size="8.5">Schematic summary · boundaries and channels vary</text>
  <text x="160" y="557" text-anchor="middle" fill="#85868c" font-size="8.5">Review every complaint before sending</text>
</svg>
