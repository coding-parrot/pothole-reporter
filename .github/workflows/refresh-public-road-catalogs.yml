name: Refresh public road catalogs

on:
  schedule:
    # Monday and Thursday at 02:17 UTC (07:47 IST).
    - cron: "17 2 * * 1,4"
  workflow_dispatch:

concurrency:
  group: public-road-catalog-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh, validate, and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install browser for the public Gujarat tender table
        run: |
          set -euo pipefail
          python3 -m pip install "playwright>=1.40,<2"
          python3 -m playwright install --with-deps chromium

      - name: Run offline parser and schema preflight
        run: |
          set -euo pipefail
          python3 tests/tender_source_registry_test.py
          python3 tests/tender_scope_test.py
          python3 tests/national_highway_contracts_test.py
          python3 tests/gepnic_tender_crawler_test.py
          python3 tests/gepnic_road_notice_pack_builder_test.py
          python3 tests/gepnic_carry_over_test.py
          python3 tests/bihar_road_tender_puller_test.py
          python3 tests/chhattisgarh_chips_road_tender_puller_test.py
          python3 tests/gujarat_nprocure_road_tender_puller_test.py
          python3 tests/lakshadweep_road_tender_puller_test.py
          python3 tests/telangana_road_tender_puller_test.py
          python3 tests/andhra_pradesh_road_tender_source_test.py
          python3 tests/kppp_road_award_puller_test.py
          python3 tests/emarg_road_contract_puller_test.py
          python3 tests/pmgsy_road_agreement_puller_test.py
          python3 tests/pmgsy_road_agreement_pack_builder_test.py
          python3 tests/catalog_pack_pruner_test.py
          python3 tests/pull_or_keep_test.py

      - name: Refresh official source snapshots
        run: |
          set -euo pipefail
          catalog_retrieved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 tools/pull-national-highway-contracts.py \
            --retrieved-at "$catalog_retrieved_at" \
            --pretty

          mkdir -p \
            data/gepnic-road-notices/sources \
            data/gepnic-road-notices/states \
            data/custom-road-tenders/br \
            data/custom-road-tenders/cg \
            data/custom-road-tenders/gj \
            data/custom-road-tenders/ld \
            data/custom-road-tenders/tg \
            data/pmgsy-road-agreements/sources
          # A portal that is down keeps its last receipt while that is inside the 7-day
          # review window: run 37573977613 timed out on West Bengal's main portal and the
          # State fell from 874 notices to 55, with a receipt two days old deleted here.
          # The committed receipts are staged outside the checkout, and the crawler copies
          # back only the receipt of a declared source that failed, so one whose source
          # has left the registry cannot linger.
          previous_gepnic_sources="$RUNNER_TEMP/gepnic-previous-sources"
          rm -rf "$previous_gepnic_sources"
          mkdir -p "$previous_gepnic_sources"
          find data/gepnic-road-notices/sources -type f -name '*.json' \
            -exec mv {} "$previous_gepnic_sources/" \;
          find data/gepnic-road-notices/states -type f -name '*.json' -delete
          python3 tools/pull-india-gepnic.py \
            --output-dir data/gepnic-road-notices \
            --previous-sources "$previous_gepnic_sources" \
            --retrieved-at "$catalog_retrieved_at" \
            --timeout 90 \
            --request-delay 0.20 \
            --allow-partial || gepnic_status=$?
          # Exit 3 is "some portals failed, ledger written". The pack builder decides
          # whether that many failures may be published; anything else is a crash.
          if [[ "${gepnic_status:-0}" != "0" && "${gepnic_status:-0}" != "3" ]]; then
            exit "$gepnic_status"
          fi
          # Source receipts plus the crawl report are the canonical inputs. The per-State
          # files duplicate every retained notice and are not used by the pack builder.
          find data/gepnic-road-notices/states -type f -name '*.json' -delete

          # A State portal that is down keeps its last snapshot (inside the 7-day review
          # window) instead of aborting every other State's refresh.
          python3 tools/pull-or-keep.py --output data/custom-road-tenders/br/in-br-eproc2.json -- \
            python3 tools/pull-bihar-road-tenders.py \
            --output data/custom-road-tenders/br/in-br-eproc2.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120
          python3 tools/pull-or-keep.py --output data/custom-road-tenders/cg/in-ct-chips.json -- \
            python3 tools/pull-chhattisgarh-chips-road-tenders.py \
            --output data/custom-road-tenders/cg/in-ct-chips.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120
          python3 tools/pull-or-keep.py --output data/custom-road-tenders/gj/in-gj-nprocure.json -- \
            python3 tools/pull-gujarat-nprocure-road-tenders.py \
            --output data/custom-road-tenders/gj/in-gj-nprocure.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120
          python3 tools/pull-or-keep.py --output data/custom-road-tenders/ld/in-ld-official-tender-notices.json -- \
            python3 tools/pull-lakshadweep-road-tenders.py \
            --output data/custom-road-tenders/ld/in-ld-official-tender-notices.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120
          python3 tools/pull-or-keep.py --output data/custom-road-tenders/tg/in-tg-eprocurement.json -- \
            python3 tools/pull-telangana-road-tenders.py \
            --output data/custom-road-tenders/tg/in-tg-eprocurement.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120

          # The PMGSY endpoint answered 401 to this runner on 7 Oct 2026 while answering
          # other networks. When the pull fails, the committed sources are kept as long as
          # they are inside the 30-day review window the pack builder gives them, so the
          # other catalogues still publish.
          find data/pmgsy-road-agreements/sources -type f -name '*.json.gz' -delete
          if ! python3 tools/pull-pmgsy-road-agreements.py \
            --all-states \
            --output-dir data/pmgsy-road-agreements/sources \
            --as-of "$catalog_retrieved_at" \
            --timeout 120; then
            git clean -fdq -- data/pmgsy-road-agreements/sources
            git checkout HEAD -- data/pmgsy-road-agreements/sources
            python3 - <<'PY'
          import gzip, json, pathlib, sys
          from datetime import datetime, timezone
          oldest = min(
              str(json.loads(gzip.decompress(path.read_bytes()))["retrieved_at"])[:10]
              for path in pathlib.Path("data/pmgsy-road-agreements/sources").glob("*.json.gz")
          )
          age = (datetime.now(timezone.utc).date() - datetime.strptime(oldest, "%Y-%m-%d").date()).days
          if age > 30:
              print(f"::error::PMGSY pull failed and the kept sources are {age} days old, past the review window")
              sys.exit(1)
          print(f"::warning::PMGSY pull failed, kept the committed sources from {age} day(s) ago")
          PY
          fi

      - name: Rebuild immutable runtime packs and manifests
        run: |
          set -euo pipefail
          python3 tools/build-highway-contract-packs.py
          python3 tools/build-gepnic-road-notice-packs.py
          python3 tools/build-pmgsy-road-agreement-packs.py
          python3 tools/prune-catalog-packs.py --apply

      - name: Verify generated catalogs without a browser
        run: |
          set -euo pipefail
          python3 tools/build-highway-contract-packs.py --check
          python3 tools/build-gepnic-road-notice-packs.py --check
          python3 tools/build-pmgsy-road-agreement-packs.py --check
          python3 tools/prune-catalog-packs.py --check
          python3 tests/tender_contract_pack_builder_test.py
          python3 tests/gepnic_road_notice_pack_builder_test.py
          python3 tests/pmgsy_road_agreement_pack_builder_test.py

      - name: Enforce catalog-only changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t catalog_changed_paths < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          for catalog_path in "${catalog_changed_paths[@]}"; do
            case "$catalog_path" in
              data/tenders-national-highways.json|\
              data/gepnic-road-notices/*|\
              data/custom-road-tenders/*|\
              data/pmgsy-road-agreements/*|\
              docs/packs/v1/contracts/*|\
              docs/packs/v1/road-notices/*|\
              docs/packs/v1/road-agreements/*|\
              static/contract-manifest-v1.36.json|\
              docs/contract-manifest-v1.36.json|\
              android-app/www/contract-manifest-v1.36.json|\
              static/road-notice-manifest-v1.36.json|\
              docs/road-notice-manifest-v1.36.json|\
              android-app/www/road-notice-manifest-v1.36.json|\
              static/road-agreement-manifest-v1.36.json|\
              docs/road-agreement-manifest-v1.36.json|\
              android-app/www/road-agreement-manifest-v1.36.json)
                ;;
              *)
                echo "Refusing to publish non-catalog change: $catalog_path" >&2
                exit 1
                ;;
            esac
          done

          if ((${#catalog_changed_paths[@]} == 0)); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Official catalogs are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf 'Catalog files changed:\n'
            printf '  %s\n' "${catalog_changed_paths[@]}"
          fi

      - name: Commit to a unique automation branch
        if: steps.changes.outputs.changed == 'true'
        env:
          CATALOG_BRANCH: automation/public-road-catalogs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git switch -c "$CATALOG_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            data/tenders-national-highways.json \
            data/gepnic-road-notices \
            data/custom-road-tenders \
            data/pmgsy-road-agreements \
            docs/packs/v1/contracts \
            docs/packs/v1/road-notices \
            docs/packs/v1/road-agreements \
            static/contract-manifest-v1.36.json \
            docs/contract-manifest-v1.36.json \
            android-app/www/contract-manifest-v1.36.json \
            static/road-notice-manifest-v1.36.json \
            docs/road-notice-manifest-v1.36.json \
            android-app/www/road-notice-manifest-v1.36.json \
            static/road-agreement-manifest-v1.36.json \
            docs/road-agreement-manifest-v1.36.json \
            android-app/www/road-agreement-manifest-v1.36.json

          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check
          git commit -m "Refresh public road catalogs"
          git push --set-upstream origin "$CATALOG_BRANCH"

      - name: Open review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          CATALOG_BRANCH: automation/public-road-catalogs-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$CATALOG_BRANCH" \
            --title "Refresh public road catalogs" \
            --body "Automated refresh from the official NHAI/MoRTH, NHIDCL, State/UT procurement, and PMGSY public feeds.

          The workflow rebuilt and schema-checked the content-addressed highway-contract, road-notice, and road-agreement packs. Review the source receipts, record-count changes, and manifest diffs before merging.

          This automation never pushes to or merges main."
