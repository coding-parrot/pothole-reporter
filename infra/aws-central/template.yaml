AWSTemplateFormatVersion: '2010-09-09'
Description: Pothole Reporter central API (HTTP API, Lambda, DynamoDB and Secrets Manager).

Parameters:
  ProjectPrefix:
    Type: String
    Default: pothole-reporter-central
    AllowedPattern: '^[a-z][a-z0-9-]{2,40}$'
  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the deployment zip.
  CodeS3Key:
    Type: String
    Description: S3 key containing the deployment zip.
  DedupeRadiusMetres:
    Type: Number
    Default: 30
  DailyVisionCap:
    Type: Number
    Default: 10000
  GlobalVisionMinuteCap:
    Type: Number
    Default: 1500
  GlobalVisionDailyCap:
    Type: Number
    Default: 100000
  MonthlyVisionCap:
    Type: Number
    Default: 1000000
  GeocoderReverseUrl:
    Type: String
    Default: https://nominatim.openstreetmap.org/reverse
    Description: Reverse geocoder the service asks for a street address when the phone sends none. Tender matching needs the street; without it every lookup ends address_unresolved.
  AlertEmail:
    Type: String
    Default: gkcs@aiengg.dev
    Description: Where production alarms go. The subscription must be confirmed once from that inbox.
  ReservedConcurrency:
    Type: Number
    Default: 160
  LogRetentionDays:
    Type: Number
    Default: 30
  SharedDetectorProvider:
    Type: String
    Default: openai_then_yolo
    AllowedValues: [openai, yolo, openai_then_yolo, yolo_then_openai, openai_with_shadow_screen]
    Description: >-
      openai_then_yolo is today's order (gpt-5-mini judges every frame, YOLO covers
      exhaustion only). yolo_then_openai screens drive frames with the YOLO Lambda first
      and sends only flagged frames to gpt-5-mini; manual photos stay OpenAI first.
      openai_with_shadow_screen answers every frame with gpt-5-mini alone and also runs
      the screen named by YoloFunctionName beside it on drive frames, logging what the
      screen said (screen_score, screen_assessment, screen_ms, screen_agrees) and never
      using it.
  YoloFunctionName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_-]{1,64}$'
    Description: >-
      Name of the YOLO detector Lambda in this account and region (YOLO_MODE lambda).
      Blank leaves the YOLO leg unconfigured and grants no invoke permission.

Conditions:
  HasYoloFunction: !Not [!Equals [!Ref YoloFunctionName, '']]

Resources:
  DetectorSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectPrefix}/detector'
      Description: Shared detector credentials. Set openai_api_key after deployment; never put keys in Lambda environment variables.
      KmsKeyId: alias/aws/secretsmanager

  InstallationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-installations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
  ControlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-control'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-usage'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  LocationLocksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-location-locks'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: cell, AttributeType: S}]
      KeySchema: [{AttributeName: cell, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  PotholesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-potholes'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: N}
        - {AttributeName: map_shard, AttributeType: S}
        - {AttributeName: last_seen_at, AttributeType: N}
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: MapIndex
          KeySchema:
            - {AttributeName: map_shard, KeyType: HASH}
            - {AttributeName: last_seen_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      SSESpecification: {SSEEnabled: true}
  SpatialTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-spatial'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: cell, AttributeType: S}
        - {AttributeName: pothole_id, AttributeType: N}
      KeySchema:
        - {AttributeName: cell, KeyType: HASH}
        - {AttributeName: pothole_id, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
  RecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-records'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  TendersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-tenders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: body_lgd, AttributeType: S}
        - {AttributeName: tender_number, AttributeType: S}
      KeySchema:
        - {AttributeName: body_lgd, KeyType: HASH}
        - {AttributeName: tender_number, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-metrics'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: day, AttributeType: S}
        - {AttributeName: metric, AttributeType: S}
      KeySchema:
        - {AttributeName: day, KeyType: HASH}
        - {AttributeName: metric, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}

  LambdaLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectPrefix}'
      RetentionInDays: !Ref LogRetentionDays

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectPrefix}-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: central-runtime-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${LambdaLogs.Arn}:*'
              - Sid: ReadWriteCentralTables
                Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:DeleteItem, dynamodb:DescribeTable, dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:TransactWriteItems, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt InstallationsTable.Arn
                  - !GetAtt ControlTable.Arn
                  - !GetAtt UsageTable.Arn
                  - !GetAtt LocationLocksTable.Arn
                  - !GetAtt PotholesTable.Arn
                  - !Sub '${PotholesTable.Arn}/index/*'
                  - !GetAtt SpatialTable.Arn
                  - !GetAtt RecordsTable.Arn
                  - !GetAtt TendersTable.Arn
                  - !GetAtt MetricsTable.Arn
              - Sid: ReadDetectorSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DetectorSecret
              # Which install is the health canary's, so it is left out of the public
              # figures. A plain parameter holding an install id, which is no secret; the
              # canary's private key is another parameter, which this role cannot read.
              - Sid: ReadCanaryInstallId
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectPrefix}/health/canary-install-id'
              - !If
                - HasYoloFunction
                - Sid: InvokeYoloDetector
                  Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${YoloFunctionName}'
                - !Ref AWS::NoValue

  CentralFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogs
    Properties:
      FunctionName: !Ref ProjectPrefix
      Description: Signed central pothole observations, public deduped map, tender resolution and shared vision.
      Runtime: nodejs22.x
      Handler: infra/aws-central/service/handler.handler
      Role: !GetAtt LambdaRole.Arn
      # 2048 MB is a little over one full vCPU; at 1024 the function had about half of
      # one and every signature check, match and gzip took twice as long.
      MemorySize: 2048
      Timeout: 29
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Architectures: [arm64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          INSTALLATIONS_TABLE: !Ref InstallationsTable
          CONTROL_TABLE: !Ref ControlTable
          USAGE_TABLE: !Ref UsageTable
          LOCATION_LOCKS_TABLE: !Ref LocationLocksTable
          POTHOLES_TABLE: !Ref PotholesTable
          SPATIAL_TABLE: !Ref SpatialTable
          RECORDS_TABLE: !Ref RecordsTable
          TENDERS_TABLE: !Ref TendersTable
          METRICS_TABLE: !Ref MetricsTable
          SHARED_SECRET_ARN: !Ref DetectorSecret
          SHARED_DETECTOR_PROVIDER: !Ref SharedDetectorProvider
          YOLO_MODE: lambda
          YOLO_FUNCTION_NAME: !If [HasYoloFunction, !Ref YoloFunctionName, !Ref AWS::NoValue]
          DEDUPE_RADIUS_METRES: !Ref DedupeRadiusMetres
          DAILY_VISION_CAP: !Ref DailyVisionCap
          GLOBAL_VISION_MINUTE_CAP: !Ref GlobalVisionMinuteCap
          GLOBAL_VISION_DAILY_CAP: !Ref GlobalVisionDailyCap
          MONTHLY_VISION_CAP: !Ref MonthlyVisionCap
          GEOCODER_REVERSE_URL: !Ref GeocoderReverseUrl
          CANARY_INSTALL_PARAMETER: !Sub '/${ProjectPrefix}/health/canary-install-id'
          NODE_OPTIONS: --enable-source-maps

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref ProjectPrefix
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [content-type, x-install-id, x-timestamp, x-signature, idempotency-key]
        AllowMethods: [GET, POST, OPTIONS]
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CentralFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: '$default'
      Target: !Sub 'integrations/${ApiIntegration}'
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        # Sized for 25 phones in Drive Mode at once (test/template-capacity.test.mjs).
        ThrottlingBurstLimit: 400
        ThrottlingRateLimit: 200
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CentralFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'

  # Keeps one function instance started, with the ownership layers, ward polygons and a
  # street tile already read (service/warm.mjs). Without it the first person after a quiet
  # spell waited 580 to 664 ms more. The event reaches no route and is not counted as a
  # request. Every minute it also re-reads the map rows, the impact period and
  # Bengaluru's tender index into memory (the map's rows are served for two minutes at
  # most, so a slower beat left the map's first visitor after a quiet spell waiting on
  # the table). About 43,200 invocations a month of under 100 ms each.
  WarmSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Keeps one central function instance started.
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: central-warm
          Arn: !GetAtt CentralFunction.Arn
          Input: '{"warm": true}'
  WarmInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CentralFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmSchedule.Arn

  # Production alarms. Every one of these fired silently for weeks before 6 October 2026:
  # 227 lookups failed on the state GIS, 197 on a missing address, 125 reports were
  # rejected on their receipt and the daily cap was hit 74 times, and nobody was told.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectPrefix}-alerts'
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  ServerErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LambdaLogs
      FilterPattern: '"\"event\":\"http_request\"" "\"status\":5"'
      MetricTransformations:
        - MetricNamespace: !Ref ProjectPrefix
          MetricName: ServerErrors
          MetricValue: '1'
          DefaultValue: 0
  RoadOwnershipUnavailableFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LambdaLogs
      FilterPattern: '"\"outcome\":\"road_ownership_unavailable\""'
      MetricTransformations:
        - MetricNamespace: !Ref ProjectPrefix
          MetricName: RoadOwnershipUnavailable
          MetricValue: '1'
          DefaultValue: 0
  AddressUnresolvedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LambdaLogs
      FilterPattern: '"\"outcome\":\"address_unresolved\""'
      MetricTransformations:
        - MetricNamespace: !Ref ProjectPrefix
          MetricName: AddressUnresolved
          MetricValue: '1'
          DefaultValue: 0
  InvalidReceiptFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LambdaLogs
      FilterPattern: '"\"outcome\":\"invalid_detection_receipt\""'
      MetricTransformations:
        - MetricNamespace: !Ref ProjectPrefix
          MetricName: InvalidDetectionReceipt
          MetricValue: '1'
          DefaultValue: 0
  VisionLimitFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LambdaLogs
      FilterPattern: '"\"outcome\":\"daily_vision_limit\""'
      MetricTransformations:
        - MetricNamespace: !Ref ProjectPrefix
          MetricName: DailyVisionLimit
          MetricValue: '1'
          DefaultValue: 0
  TenderMatchedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LambdaLogs
      FilterPattern: '"\"outcome\":\"tender_matched\""'
      MetricTransformations:
        - MetricNamespace: !Ref ProjectPrefix
          MetricName: TenderMatched
          MetricValue: '1'
          DefaultValue: 0
  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-5xx'
      AlarmDescription: Five or more 5xx answers in 15 minutes.
      Namespace: !Ref ProjectPrefix
      MetricName: ServerErrors
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  RoadOwnershipAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-road-ownership-unavailable'
      AlarmDescription: Ten or more tender lookups in an hour could not classify the road; the state GIS is down and the local fallback did not cover the points.
      Namespace: !Ref ProjectPrefix
      MetricName: RoadOwnershipUnavailable
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  AddressUnresolvedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-address-unresolved'
      AlarmDescription: Ten or more tender lookups in an hour had no usable street address; the reverse geocoder is failing.
      Namespace: !Ref ProjectPrefix
      MetricName: AddressUnresolved
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  InvalidReceiptAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-invalid-detection-receipt'
      AlarmDescription: A shared report was rejected on its own detection receipt. This is a bug, never user error.
      Namespace: !Ref ProjectPrefix
      MetricName: InvalidDetectionReceipt
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  VisionLimitAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-daily-vision-limit'
      AlarmDescription: Users hit the per-install daily detection cap five or more times in an hour. Raise DailyVisionCap.
      Namespace: !Ref ProjectPrefix
      MetricName: DailyVisionLimit
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-lambda-errors'
      AlarmDescription: The function crashed or was throttled.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CentralFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # Scheduled production health: the rules of service/health (the log window and the
  # canary), run here instead of by a GitHub schedule, which fired every 4 to 5 hours
  # when asked for every hour and held AWS keys. Same package as the central function,
  # another handler. It reaches production only as a phone does, through the public API,
  # so its role has no table, no secret and no function to invoke.
  HealthLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectPrefix}-health'
      RetentionInDays: !Ref LogRetentionDays
  HealthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectPrefix}-health'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: health-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${HealthLogs.Arn}:*'
              - Sid: QueryCentralRequestLog
                Effect: Allow
                Action: logs:StartQuery
                Resource: !GetAtt LambdaLogs.Arn
              # These two name a query by its id and take no log group: IAM has no
              # narrower resource for them. The only queries this role can start, and so
              # the only ids it holds, are on the one log group above. This is the grant
              # the GitHub check ran with.
              - Sid: ReadAndStopItsQueries
                Effect: Allow
                Action: [logs:GetQueryResults, logs:StopQuery]
                Resource: '*'
              # The canary's one install key, a SecureString under the account's default
              # aws/ssm key, which every principal allowed to read a parameter may use.
              - Sid: KeepCanaryKey
                Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectPrefix}/health/canary-key'
              # The id of that install, published for the central function to read, so
              # that the canary is left out of the public figures.
              - Sid: PublishCanaryInstallId
                Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectPrefix}/health/canary-install-id'
  HealthFunction:
    Type: AWS::Lambda::Function
    DependsOn: HealthLogs
    Properties:
      FunctionName: !Sub '${ProjectPrefix}-health'
      Description: Scheduled production health. Judges the central request log and runs the canary against the public API.
      Runtime: nodejs22.x
      Handler: infra/aws-central/service/health/handler.handler
      Role: !GetAtt HealthRole.Arn
      # It waits on Logs Insights and on the API and computes nothing: a six hour window
      # and the reads canary took 3.1 s on 7 Oct 2026, and the bill is seconds times this.
      MemorySize: 256
      # Longer than the slowest run that still ends in a report: the window gives up on a
      # query after 45 s (twice, 90 s), and the full canary after it can wait 220 s on
      # requests that each time out. A run cut off here writes nothing, and the
      # HealthSilentAlarm reports it.
      Timeout: 330
      # One at a time: two canaries at once would be two detections for one answer.
      ReservedConcurrentExecutions: 1
      Architectures: [arm64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          API_URL: !GetAtt Api.ApiEndpoint
          CENTRAL_LOG_GROUP: !Ref LambdaLogs
          METRIC_NAMESPACE: !Ref ProjectPrefix
          CANARY_KEY_PARAMETER: !Sub '/${ProjectPrefix}/health/canary-key'
          CANARY_INSTALL_PARAMETER: !Sub '/${ProjectPrefix}/health/canary-install-id'
  # A run is worth nothing late and must not be repeated: Lambda would otherwise retry a
  # failed or throttled run twice, for up to six hours, and each full canary is a paid
  # detection. The next scheduled run is the retry.
  HealthInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref HealthFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 60

  # The cadence, and what it costs (Mumbai prices, measured 7 Oct 2026; README has the
  # table). Each rule sends the event that says what to run; they fire half an hour
  # apart because the function runs one at a time.
  #
  # Every hour: the log window over the last six hours. Six queries scanned 13.9 MB
  # between them, at USD 0.0067 a GB: about 7 cents a month. An hour is how long a broken
  # rule goes unseen; the rules need the six hours to have enough requests to judge.
  # Then the full canary.
  HealthWindowSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Hourly. Judges the last six hours of the central request log, and runs the full canary.
      ScheduleExpression: cron(17 * * * ? *)
      State: ENABLED
      Targets:
        - Id: health-window
          Arn: !GetAtt HealthFunction.Arn
          Input: '{"window": "6h", "canary": "full"}'
  # On the half hour between: the full canary alone. With the one above that is a real
  # detection (USD 0.0005) and three signed tender lookups every 30 minutes: 1,440
  # detections a month, 72 cents. It ran every three hours until the service could tell
  # the canary's requests from people's; now its lines are marked, the window rules skip
  # them and the public figures do not count them.
  HealthCanarySchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Hourly, half an hour after the window. The full canary, with one detection and three tender lookups.
      ScheduleExpression: cron(47 * * * ? *)
      State: ENABLED
      Targets:
        - Id: health-canary
          Arn: !GetAtt HealthFunction.Arn
          Input: '{"canary": "full"}'
  HealthWindowInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HealthFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HealthWindowSchedule.Arn
  HealthCanaryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HealthFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HealthCanarySchedule.Arn

  # The health function writes its two metrics only when something is broken (a custom
  # metric is charged for each hour it receives a value), so for these two alarms no data
  # is the healthy state. CloudWatch then judges the latest values it finds in a range
  # two periods longer than the alarm's own: an alarm clears when its failures have left
  # that range, hours after production recovered, never on the next run.
  HealthRulesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-health-rules-broken'
      AlarmDescription: A log window rule was broken on two hourly evaluations. The health function's log has the report, and tools/production-health.mjs --window 6h prints it.
      Namespace: !Ref ProjectPrefix
      MetricName: HealthBrokenRules
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  # One failed canary is enough: it is a request a person would have made. Canaries are
  # half an hour apart and CloudWatch looks back three periods (1.5 hours), so a standing
  # fault keeps the alarm on and does not send a mail on every run.
  HealthCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-health-canary-failed'
      AlarmDescription: The canary failed against the live API. The health function's log has the report, and tools/production-health.mjs --canary runs it again.
      Namespace: !Ref ProjectPrefix
      MetricName: HealthCanaryFailed
      Statistic: Maximum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
  # A dead checker must not look healthy. Runs that finished are the function's own
  # Invocations less its Errors, which Lambda counts at no charge; it runs every half
  # hour, so two half hours with none finished (crashed, timed out, throttled or never
  # invoked) is the checker down. No data here is the fault itself.
  HealthSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectPrefix}-health-not-running'
      AlarmDescription: The scheduled health function did not finish a run in two half hours. Production is not being checked.
      Metrics:
        - Id: finished
          Expression: invocations - errors
          Label: Health runs that finished
          ReturnData: true
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref HealthFunction
            Period: 1800
            Stat: Sum
          ReturnData: false
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref HealthFunction
            Period: 1800
            Stat: Sum
          ReturnData: false
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
  ApiUrl:
    Description: Native AWS API endpoint; use this as the app's shared service URL.
    Value: !GetAtt Api.ApiEndpoint
  DetectorSecretArn:
    Description: Store {"openai_api_key":"..."} here to enable no-key shared vision.
    Value: !Ref DetectorSecret
  FunctionName:
    Value: !Ref CentralFunction
  HealthFunctionName:
    Description: The scheduled health function. deploy.sh invokes it once after every deploy.
    Value: !Ref HealthFunction
