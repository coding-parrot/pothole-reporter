apply plugin: 'com.android.application'

def releasePropertiesFile = rootProject.file('keystore.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

def releaseValue = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) {
        return environmentValue
    }

    def propertyValue = releaseProperties.getProperty(propertyName)
    return propertyValue != null && !propertyValue.trim().isEmpty() ? propertyValue : null
}

def releaseStorePath = releaseValue('POTHOLE_RELEASE_STORE_FILE', 'storeFile')
def releaseStorePassword = releaseValue('POTHOLE_RELEASE_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = releaseValue('POTHOLE_RELEASE_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = releaseValue('POTHOLE_RELEASE_KEY_PASSWORD', 'keyPassword')
def releaseStoreFile = releaseStorePath != null ? rootProject.file(releaseStorePath) : null
def missingReleaseValues = [
    storeFile: releaseStorePath,
    storePassword: releaseStorePassword,
    keyAlias: releaseKeyAlias,
    keyPassword: releaseKeyPassword,
].findAll { entry -> entry.value == null }.keySet()
def requestedReleaseBuild = gradle.startParameter.taskNames.any { requestedTask ->
    def taskName = requestedTask.tokenize(':').last().toLowerCase()
    taskName.contains('release') || taskName in ['assemble', 'build', 'bundle', 'package']
}

if (requestedReleaseBuild && !missingReleaseValues.isEmpty()) {
    throw new GradleException(
        "Release signing is not configured (missing ${missingReleaseValues.join(', ')}). " +
        'Set POTHOLE_RELEASE_STORE_FILE, POTHOLE_RELEASE_STORE_PASSWORD, ' +
        'POTHOLE_RELEASE_KEY_ALIAS, and POTHOLE_RELEASE_KEY_PASSWORD, or create the ignored ' +
        'android-app/android/keystore.properties file from keystore.properties.example.'
    )
}
if (requestedReleaseBuild && releaseStoreFile != null && !releaseStoreFile.isFile()) {
    throw new GradleException("Release keystore does not exist: ${releaseStoreFile}")
}

def releaseSigningReady = missingReleaseValues.isEmpty() && releaseStoreFile != null && releaseStoreFile.isFile()

android {
    namespace = "com.gauravsen.potholereporter"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gauravsen.potholereporter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 34
        versionName "1.18.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
