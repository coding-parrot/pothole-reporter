apply from: "variables.gradle"

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.1.0-1.0.29'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Cordova/AndroidX still request split Kotlin 1.6/1.8 stdlib artifacts in some
    // transitive graphs. Keep every module, including otherwise-empty instrumentation
    // modules, on the app's single Kotlin runtime so duplicate classes cannot enter an APK.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion(rootProject.ext.kotlinVersion)
                details.because('all Android modules must use one Kotlin stdlib runtime')
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
