<svg xmlns="http://www.w3.org/2000/svg" width="320" height="720" viewBox="0 0 320 720" role="img" aria-labelledby="title description">
  <title id="title">Pothole Reporter nationwide India coverage overview</title>
  <desc id="description">Schematic India coverage map. All 28 states and 8 Union Territories have coordinate-pinned boundary containment and conservative official grievance handoffs. Mapped National Highways and existing exact city or authority routes retain precedence. The 50 available routes shown for population centres follow Census of India 2011 table A-04 (I). Eight markers use conservative structured city-name routes; these markers identify population centres and do not represent complete urban-agglomeration boundaries. Coverage does not prove road ownership, and nothing is submitted automatically.</desc>
  <defs>
    <linearGradient id="state-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#251b15"/>
    </linearGradient>
    <linearGradient id="road-card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17291e"/>
      <stop offset="1" stop-color="#14221a"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill: #ff9b54; font-size: 10px; font-weight: 700; letter-spacing: 1.35px; }
      .heading { fill: #f2f2f4; font-size: 23px; font-weight: 750; }
      .section { fill: #9a9ba1; font-size: 9px; font-weight: 700; letter-spacing: 1.15px; }
      .map-outline { fill: #2a1d15; stroke: #ff8b3d; stroke-width: 1.3; stroke-linejoin: round; }
      .map-inner { fill: none; stroke: #65422c; stroke-width: 0.8; stroke-dasharray: 3 4; }
      .marker circle { vector-effect: non-scaling-stroke; }
      .marker.available circle { fill: #ff7a1a; stroke: #ffd0ae; stroke-width: 0.8; }
      .legend { fill: #b7b9bf; font-size: 9.2px; font-weight: 600; }
      .small { fill: #aeb0b6; font-size: 9px; font-weight: 500; }
    </style>
  </defs>

