<svg xmlns="http://www.w3.org/2000/svg" width="320" height="720" viewBox="0 0 320 720" role="img" aria-labelledby="title description">
  <title id="title">Pothole Reporter top-50 coverage overview</title>
  <desc id="description">Schematic map of 50 available routes for the population centres ranked in Census of India 2011 table A-04 (I). Thirty-one markers use conservative structured city-name routes; these markers identify population centres and do not represent complete urban-agglomeration boundaries. Maharashtra, West Bengal, Punjab, Tamil Nadu, Andhra Pradesh, and Telangana have statewide neutral grievance handoffs. Chandigarh is excluded from Punjab; Puducherry and Karaikal are excluded from Tamil Nadu; Yanam is excluded from Andhra Pradesh. Mapped National Highways and Expressways use a separate pothole route across India.</desc>
  <defs>
    <linearGradient id="state-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#251b15"/>
    </linearGradient>
    <linearGradient id="road-card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17291e"/>
      <stop offset="1" stop-color="#14221a"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill: #ff9b54; font-size: 10px; font-weight: 700; letter-spacing: 1.35px; }
      .heading { fill: #f2f2f4; font-size: 23px; font-weight: 750; }
      .section { fill: #9a9ba1; font-size: 9px; font-weight: 700; letter-spacing: 1.15px; }
      .map-outline { fill: #181a1e; stroke: #555860; stroke-width: 1.3; stroke-linejoin: round; }
      .map-inner { fill: none; stroke: #2b2e34; stroke-width: 0.8; stroke-dasharray: 3 4; }
      .marker circle { vector-effect: non-scaling-stroke; }
      .marker.available circle { fill: #ff7a1a; stroke: #ffd0ae; stroke-width: 0.8; }
      .legend { fill: #b7b9bf; font-size: 9.2px; font-weight: 600; }
      .small { fill: #aeb0b6; font-size: 9px; font-weight: 500; }
    </style>
  </defs>

