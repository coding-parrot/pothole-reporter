name: Production health

# A manual run of infra/aws-central/tools/production-health.mjs: the last six hours of
# the request log, judged, and the canary against the live service. A broken rule fails
# the run and opens or updates one issue; a healthy run closes it.
#
# This workflow has no schedule. The scheduled check lives in the stack itself: the
# HealthFunction in infra/aws-central/template.yaml (code in
# infra/aws-central/service/health) is run by EventBridge every half hour and tells the
# stack's alert topic through three CloudWatch alarms. It moved there on 7 Oct 2026
# because GitHub ran this workflow's hourly schedule every 4 to 5 hours. The same rules
# gate every deploy (infra/aws-central/deploy.sh).

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  health:
    name: Judge the last six hours and run the canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_HEALTH_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_HEALTH_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Judge the window and run the canary
        id: health
        run: |
          set -o pipefail
          node infra/aws-central/tools/production-health.mjs --window 6h --canary | tee health.txt
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Production health is failing"
          body="$(printf 'Run: %s\n\n```\n%s\n```\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$(tail -60 health.txt)")"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
      - name: Close the issue when healthy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --search "\"Production health is failing\" in:title" --json number --jq '.[0].number // empty')"
          [[ -z "$number" ]] || gh issue close "$number" --comment "Healthy again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
