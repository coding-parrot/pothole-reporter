apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'


def releasePropertiesFile = rootProject.file('keystore.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

def releaseValue = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) {
        return environmentValue
    }

    def propertyValue = releaseProperties.getProperty(propertyName)
    return propertyValue != null && !propertyValue.trim().isEmpty() ? propertyValue : null
}

def releaseStorePath = releaseValue('POTHOLE_RELEASE_STORE_FILE', 'storeFile')
def releaseStorePassword = releaseValue('POTHOLE_RELEASE_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = releaseValue('POTHOLE_RELEASE_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = releaseValue('POTHOLE_RELEASE_KEY_PASSWORD', 'keyPassword')
def releaseStoreFile = releaseStorePath != null ? rootProject.file(releaseStorePath) : null
def missingReleaseValues = [
    storeFile: releaseStorePath,
    storePassword: releaseStorePassword,
    keyAlias: releaseKeyAlias,
    keyPassword: releaseKeyPassword,
].findAll { entry -> entry.value == null }.keySet()
def releaseArtifactTaskPrefixes = ['assemble', 'bundle', 'package', 'publish', 'install']
def requestedReleaseBuild = gradle.startParameter.taskNames.any { requestedTask ->
    def taskName = requestedTask.tokenize(':').last().toLowerCase()
    taskName in ['assemble', 'build', 'bundle', 'package'] ||
        (taskName.contains('release') && releaseArtifactTaskPrefixes.any { taskName.startsWith(it) })
}

if (requestedReleaseBuild && !missingReleaseValues.isEmpty()) {
    throw new GradleException(
        "Release signing is not configured (missing ${missingReleaseValues.join(', ')}). " +
        'Set POTHOLE_RELEASE_STORE_FILE, POTHOLE_RELEASE_STORE_PASSWORD, ' +
        'POTHOLE_RELEASE_KEY_ALIAS, and POTHOLE_RELEASE_KEY_PASSWORD, or create the ignored ' +
        'android-app/android/keystore.properties file from keystore.properties.example.'
    )
}
if (requestedReleaseBuild && releaseStoreFile != null && !releaseStoreFile.isFile()) {
    throw new GradleException("Release keystore does not exist: ${releaseStoreFile}")
}

def releaseSigningReady = missingReleaseValues.isEmpty() && releaseStoreFile != null && releaseStoreFile.isFile()

android {
    namespace = "com.gauravsen.potholereporter"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // The Play Console app record is registered under this ID and it cannot be
        // changed there. The Kotlin namespace above stays as it is, so no source
        // file moves and the manifest keeps resolving relative class names to it.
        applicationId "dev.aiengg.potholereporter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 70
        versionName "1.39.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

def repositoryRootDir = rootProject.projectDir.parentFile.parentFile
def verifyGeneratedLlmContract = tasks.register('verifyGeneratedLlmContract', Exec) {
    workingDir repositoryRootDir
    commandLine 'node', 'llm/generate.mjs', '--check'
}
def verifyWebAssetParity = tasks.register('verifyWebAssetParity') {
    doLast {
        ['index.html', 'standalone.js'].each { assetName ->
            def canonicalAsset = new File(repositoryRootDir, "static/${assetName}")
            if (!canonicalAsset.isFile()) {
                throw new GradleException("Missing canonical web asset: ${canonicalAsset}")
            }
            [
                new File(repositoryRootDir, "android-app/www/${assetName}"),
                new File(projectDir, "src/main/assets/public/${assetName}"),
            ].each { shippedAsset ->
                if (!shippedAsset.isFile()) {
                    throw new GradleException("Missing shipped web asset: ${shippedAsset}")
                }
                if (!java.util.Arrays.equals(canonicalAsset.bytes, shippedAsset.bytes)) {
                    throw new GradleException(
                        "Stale shipped web asset: ${shippedAsset}. " +
                        "Run tools/build-apk.sh (or sync static/ through Capacitor) first."
                    )
                }
            }
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn verifyGeneratedLlmContract
    dependsOn verifyWebAssetParity
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Keep the RTSP/exoplayer line on the cached stable artifact used by this
    // release; the frame inspector/effect modules are available on the newer
    // line and are binary-compatible for the isolated importer APIs.
    def media3Version = "1.10.1"
    def media3ImporterVersion = rootProject.ext.media3Version
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.camera:camera-core:$cameraXVersion"
    implementation "androidx.camera:camera-camera2:$cameraXVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraXVersion"
    implementation "androidx.camera:camera-video:$cameraXVersion"
    implementation "androidx.camera:camera-view:$cameraXVersion"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3Version"
    implementation "com.google.android.gms:play-services-location:$playServicesLocationVersion"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycleVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:$workVersion"

    // Native, seekable frame extraction from persisted SAF content URIs. This keeps
    // multi-gigabyte dashcam footage out of JavaScript memory and app-private storage.
    implementation "androidx.media3:media3-inspector-frame:$media3ImporterVersion"
    implementation "androidx.media3:media3-effect:$media3ImporterVersion"

}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
